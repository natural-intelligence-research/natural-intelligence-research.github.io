<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" />
  {% include head-custom.html %}
</head>

<body>
  <header class="site-header">
    <div class="site-container">
      <div class="header-contents">
        <a href="{{ '/' | relative_url }}" class="logo">
          <img src="{{ '/assets/images/nir-logo.png' | relative_url }}" alt="{{ site.title }}" />
        </a>

        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}is-current{% endif %}"{% if page.url == '/' %} aria-current="page"{% endif %}>Top</a>
          <a href="{{ '/projects' | relative_url }}" class="{% if page.url contains '/projects' %}is-current{% endif %}"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>Projects</a>
          <a href="{{ '/team' | relative_url }}" class="{% if page.url contains '/team' %}is-current{% endif %}"{% if page.url contains '/team' %} aria-current="page"{% endif %}>Team</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="site-container site-content">{{ content }}</main>

  <footer class="site-footer">
    <div class="site-container footer">
      <p>
        &copy;{{ site.time | date: '%Y' }} {{ site.author }}. All Rights Reserved
      </p>
    </div>
</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js"
    integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
  <script>
    anchors.add();
  </script>
</body>

</html>
