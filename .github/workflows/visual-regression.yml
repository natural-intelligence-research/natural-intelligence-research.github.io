name: Visual regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Jekyll site
        run: docker compose run --rm jekyll sh -c 'bundle install && bundle exec jekyll build'
      - name: Run visual regression tests
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/work"
          --workdir /work/vrt
          mcr.microsoft.com/playwright:v1.63.0-jammy
          sh -c 'npm ci && npm test'
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: vrt/playwright-report/
          retention-days: 30
